# Local AWS emulation for testing Terraform without an AWS account.
#
# LocalStack is a single container that emulates S3, DynamoDB, IAM, EC2, and
# STS. The AWS provider (v6) honours AWS_ENDPOINT_URL, so the same Terraform
# code runs against LocalStack or real AWS with no changes.
#
#   docker compose up -d localstack
#   docker compose run --rm terraform -c "cd environments/dev && terraform init -input=false && terraform plan -input=false"
#   docker compose down

services:
  localstack:
    image: docker.io/localstack/localstack:3.8
    container_name: tf-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,iam,ec2,sts
      - DEBUG=0
      - PERSISTENCE=0
      # The AWS provider v6 reads account-level S3 tags through the S3 *Control*
      # API, which it addresses as https://<account-id>.<endpoint>. LocalStack
      # does not resolve that host form, so the provider's post-create tag read
      # fails locally with:
      #   dial tcp: lookup 000000000000.127.0.0.1: no such host
      #
      # This only affects the local emulator. Against real AWS the call
      # succeeds. To get a fully clean local apply, either:
      #   a) upgrade to a LocalStack release that supports S3 Control, or
      #   b) run `terraform plan` locally (which is enough to prove the config)
      #      and reserve `apply` for a real or ephemeral AWS account.
      - S3_SKIP_SIGNATURE_VALIDATION=1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  terraform:
    image: hashicorp/terraform:1.9
    container_name: tf-runner
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    environment:
      # Dummy credentials — LocalStack accepts anything non-empty.
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=eu-west-1
      # This single variable redirects every AWS API call to LocalStack.
      - AWS_ENDPOINT_URL=http://localstack:4566
    volumes:
      - "./:/workspace"
    depends_on:
      localstack:
        condition: service_healthy
