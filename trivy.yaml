# Trivy configuration for Terraform misconfiguration scanning.
#
# Only Terraform checks are run; this project provisions VPC, S3, IAM, and the
# state backend, and nothing else.

misconfiguration:
  scanners:
    - terraform

severity:
  - HIGH
  - CRITICAL

# Findings that are accepted rather than fixed live in .trivyignore, which is
# the mechanism Trivy provides for this. There is no `skip-check` key in the
# config-file schema; see references/configuration/config-file.

exit-code: 1
